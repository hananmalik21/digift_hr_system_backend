name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/apps/backend

            PRESERVE_DIR="$(mktemp -d)"
            for item in Wallet TESTDB .env firebase-service-account.json; do
              if [ -e "$item" ]; then
                cp -a "$item" "$PRESERVE_DIR/"
              fi
            done

            echo "[CI] Synchronizing production source..."
            git fetch origin main
            git reset --hard origin/main

            for item in Wallet TESTDB .env firebase-service-account.json; do
              if [ -e "$PRESERVE_DIR/$item" ]; then
                rm -rf "$item"
                cp -a "$PRESERVE_DIR/$item" "$item"
              fi
            done
            rm -rf "$PRESERVE_DIR"

            echo "[CI] Starting production deployment..."
            bash ./deploy.sh
