openapi: 3.0.3
info:
  title: Digify ERP — Payroll Element Entries API
  version: 2.0.0
  description: |
    Create, update, and delete payroll element entries via `PAY.PAY_ELEMENT_ENTRIES_PKG`.
    List and read use `PAY.V_PAY_ELEMENT_ENTRIES`.

    Update and delete use `element_entry_guid` only (never `element_entry_id`).

    Optional (nullable) on create/update: `pay_value`, `amount`, `currency_code`,
    `context_segment_code`, `context_value`, `sub_classification_code`.
    Update is PATCH-style: omitted fields are preserved; explicit `null` clears stored values.

    Costing: `cost_allocation_keyflex_id` is VARCHAR2(100).

    Uses `element_id` (not `component_id`). Removed/unsupported: `component_id`, `INPUT_VALUE_ID`, `TEXT_VALUE`, `DATE_VALUE`, `ASSIGNMENT_ID`.

    **Auth:** JWT required. Audit columns from `req.user.username`.

    **HTTP status:** Package business errors return HTTP 200 with `success: false`.
servers:
  - url: /
tags:
  - name: Payroll Element Entries
    description: Element entry lifecycle via PAY.PAY_ELEMENT_ENTRIES_PKG
paths:
  /api/pay/element-entries:
    get:
      tags: [Payroll Element Entries]
      summary: List element entries
      operationId: listPayElementEntries
      description: |
        Reads from `PAY.V_PAY_ELEMENT_ENTRIES` for the Manage Element Entries list screen.
        `enterprise_id` is required. `effective_date` matches rows where the date falls between
        `EFFECTIVE_START_DATE` and `EFFECTIVE_END_DATE` (open-ended when `EFFECTIVE_END_DATE` is null).
      parameters:
        - name: enterprise_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: employee_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: element_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: payroll_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approval_status_code
          in: query
          schema: { type: string }
        - name: run_type_code
          in: query
          schema:
            type: string
            enum: [REGULAR, SUPPLEMENTAL, RETRO, BONUS]
          description: |
            Optional filter against PAY.V_PAY_ELEMENT_ENTRIES.RUN_TYPE_CODE.
            REGULAR: Normal scheduled payroll-cycle entry.
            SUPPLEMENTAL: Additional/off-cycle payroll entry.
            RETRO: Retroactive adjustment entry.
            BONUS: Bonus payroll entry.
        - name: effective_start_date
          in: query
          schema: { type: string, format: date }
        - name: effective_end_date
          in: query
          schema: { type: string, format: date }
        - name: sortBy
          in: query
          schema: { type: string, enum: [employee_id, element_id, effective_start_date, creation_date] }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated element entry list (empty array when no rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryListResponse'
        '400':
          description: Validation error
        '500':
          description: Unexpected system error
    post:
      tags: [Payroll Element Entries]
      summary: Create element entry
      operationId: createPayElementEntry
      description: Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.CREATE_ELEMENT_ENTRY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementEntryCreateRequest'
            examples:
              minimalCreate:
                summary: Required fields only (no value/context children)
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
              regularCreate:
                summary: REGULAR run type
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
                  run_type_code: REGULAR
              retroCreate:
                summary: RETRO run type
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
                  run_type_code: RETRO
                  retroactive_flag: Y
              bonusCreate:
                summary: BONUS run type
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
                  run_type_code: BONUS
                  retroactive_flag: N
              supplementalCreate:
                summary: SUPPLEMENTAL run type
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
                  run_type_code: SUPPLEMENTAL
                  retroactive_flag: N
              withOptionalFields:
                summary: Create with optional value/context fields
                value:
                  enterprise_id: 1
                  employee_id: 292
                  element_id: 3
                  effective_as_of_date: '2026-07-15'
                  effective_start_date: '2026-07-15'
                  context_segment_code: OVERTIME_TYPE
                  context_value: WEEKEND
                  sub_classification_code: REGULAR_OVERTIME
                  currency_code: KWD
                  pay_value: 125.5
                  amount: 125.5
                  run_type_code: REGULAR
      responses:
        '200':
          description: Create succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryCreateResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Request validation or reference validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '500':
          description: Unexpected system error
  /api/pay/element-entries/export:
    get:
      tags: [Payroll Element Entries]
      summary: Export element entries as Excel
      operationId: exportPayElementEntries
      description: |
        Same filters as list (`enterprise_id` required). Returns all matching rows as an Excel
        download (no pagination). Nested entry/costing/context values are JSON-stringified.
      parameters:
        - name: enterprise_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: employee_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: element_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: payroll_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: approval_status_code
          in: query
          schema: { type: string }
        - name: run_type_code
          in: query
          schema:
            type: string
            enum: [REGULAR, SUPPLEMENTAL, RETRO, BONUS]
          description: Optional filter against PAY.V_PAY_ELEMENT_ENTRIES.RUN_TYPE_CODE
        - name: effective_start_date
          in: query
          schema: { type: string, format: date }
        - name: effective_end_date
          in: query
          schema: { type: string, format: date }
        - name: sortBy
          in: query
          schema: { type: string, enum: [employee_id, element_id, effective_start_date, creation_date] }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Excel workbook (.xlsx) download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Validation error
        '404':
          description: No element entries found to export
        '500':
          description: Unexpected system error
  /api/pay/element-entries/{elementEntryGuid}:
    parameters:
      - $ref: '#/components/parameters/ElementEntryGuidPath'
    get:
      tags: [Payroll Element Entries]
      summary: Get element entry by GUID
      operationId: getPayElementEntryByGuid
      description: Returns one row from `PAY.V_PAY_ELEMENT_ENTRIES` by `element_entry_guid`.
      responses:
        '200':
          description: Element entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryDetailResponse'
        '400':
          description: Invalid GUID
        '404':
          description: Element entry not found
        '500':
          description: Unexpected system error
    put:
      tags: [Payroll Element Entries]
      summary: Update element entry
      operationId: updatePayElementEntry
      description: |
        Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.UPDATE_ELEMENT_ENTRY` by `element_entry_guid`.
        PATCH-style: omitted fields are preserved; explicit `null` clears stored values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementEntryUpdateRequest'
            examples:
              partialAmount:
                summary: Change amount only
                value:
                  amount: 150
              runTypeBonus:
                summary: Change run type only
                value:
                  run_type_code: BONUS
              clearOptionalFields:
                summary: Clear optional value/context fields
                value:
                  pay_value: null
                  amount: null
                  currency_code: null
                  context_segment_code: null
                  context_value: null
                  sub_classification_code: null
      responses:
        '200':
          description: Update succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryMutationResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Request validation error
        '500':
          description: Unexpected system error
    delete:
      tags: [Payroll Element Entries]
      summary: Delete element entry
      operationId: deletePayElementEntry
      description: Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.DELETE_ELEMENT_ENTRY` by `element_entry_guid`.
      responses:
        '200':
          description: Delete succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryMutationResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Invalid GUID
        '500':
          description: Unexpected system error
components:
  parameters:
    ElementEntryGuidPath:
      name: elementEntryGuid
      in: path
      required: true
      description: 32-character hexadecimal element_entry_guid
      schema:
        type: string
        example: a1b2c3d4e5f6789012345678abcdef01
  schemas:
    ElementEntryCreateRequest:
      type: object
      required:
        - enterprise_id
        - employee_id
        - element_id
        - effective_as_of_date
        - effective_start_date
      additionalProperties: true
      properties:
        enterprise_id: { type: integer, minimum: 1 }
        employee_id: { type: integer, minimum: 1 }
        payroll_id: { type: integer, minimum: 1, nullable: true }
        element_id: { type: integer, minimum: 1 }
        element_classification_code: { type: string, nullable: true }
        sub_classification_code: { type: string, nullable: true }
        secondary_classification: { type: string, nullable: true }
        effective_as_of_date: { type: string, format: date }
        effective_start_date: { type: string, format: date }
        effective_end_date: { type: string, format: date, nullable: true }
        entry_type_code: { type: string }
        source_code: { type: string }
        element_processing_type_code: { type: string }
        subpriority: { type: integer }
        creator_type_code: { type: string }
        processed_flag: { type: string, enum: [Y, N] }
        retroactive_flag: { type: string, enum: [Y, N] }
        run_type_code:
          type: string
          nullable: true
          enum: [REGULAR, SUPPLEMENTAL, RETRO, BONUS]
          description: |
            Optional. Omit to let Oracle apply backward-compatible defaults.
            REGULAR: Normal scheduled payroll-cycle entry.
            SUPPLEMENTAL: Additional/off-cycle payroll entry.
            RETRO: Retroactive adjustment entry.
            BONUS: Bonus payroll entry.
        automatic_entry_flag: { type: string, enum: [Y, N] }
        sequence_number: { type: integer }
        reason_text: { type: string }
        pay_value: { type: number, nullable: true, description: Optional PAY_VALUE NUMBER(18,3) }
        amount: { type: number, nullable: true, description: Optional AMOUNT NUMBER(18,3) }
        currency_code: { type: string, nullable: true }
        cost_allocation_keyflex_id:
          type: string
          maxLength: 100
          description: VARCHAR2(100) cost allocation key flexfield id
        costing_type_code: { type: string }
        account_code: { type: string }
        cost_center_code: { type: string }
        context_segment_code: { type: string, nullable: true }
        context_value: { type: string, nullable: true }
        approval_status_code: { type: string }
        comments: { type: string }
        source_reference: { type: string, nullable: true }
        batch_id: { type: string, nullable: true }
    ElementEntryUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: |
        PATCH-style update. Omitted fields are preserved. Explicit null clears the stored value.
      properties:
        enterprise_id: { type: integer }
        employee_id: { type: integer }
        payroll_id: { type: integer, nullable: true }
        element_id: { type: integer }
        pay_value: { type: number, nullable: true }
        amount: { type: number, nullable: true }
        currency_code: { type: string, nullable: true }
        context_segment_code: { type: string, nullable: true }
        context_value: { type: string, nullable: true }
        sub_classification_code: { type: string, nullable: true }
        secondary_classification: { type: string, nullable: true }
        cost_allocation_keyflex_id: { type: string, maxLength: 100 }
        comments: { type: string }
        run_type_code:
          type: string
          nullable: true
          enum: [REGULAR, SUPPLEMENTAL, RETRO, BONUS]
          description: |
            Optional. Omit to preserve the stored value; Oracle owns cross-field consistency.
            REGULAR: Normal scheduled payroll-cycle entry.
            SUPPLEMENTAL: Additional/off-cycle payroll entry.
            RETRO: Retroactive adjustment entry.
            BONUS: Bonus payroll entry.
        effective_end_date: { type: string, format: date, nullable: true }
        batch_id: { type: string, nullable: true }
    ElementEntryCreateResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            element_entry_id: { type: integer }
            element_entry_guid: { type: string }
    ElementEntryMutationResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    ElementEntryBusinessErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    ElementEntryListItem:
      type: object
      properties:
        element_entry_id: { type: integer }
        element_entry_guid: { type: string }
        enterprise_id: { type: integer }
        employee_id: { type: integer }
        payroll_id: { type: integer }
        element_id: { type: integer }
        element_name: { type: string }
        primary_entry_value: { type: number }
        amount: { type: number }
        currency_code: { type: string }
        value_name: { type: string }
        source: { type: string }
        employment_level: { type: string }
        seq: { type: integer }
        reason: { type: string }
        classification: { type: string }
        ldg: { type: string }
        emp_number: { type: string }
        status: { type: string }
        effective_as_of_date: { type: string, format: date }
        effective_start_date: { type: string, format: date }
        effective_end_date: { type: string, format: date, nullable: true }
        entry_type_code:
          type: string
          description: Distinct from run_type_code (e.g. STANDARD, ELEMENT_ENTRY)
        run_type_code:
          type: string
          nullable: true
          enum: [REGULAR, SUPPLEMENTAL, RETRO, BONUS]
          description: |
            From PAY.V_PAY_ELEMENT_ENTRIES.RUN_TYPE_CODE. Historical rows may be null.
            REGULAR: Normal scheduled payroll-cycle entry.
            SUPPLEMENTAL: Additional/off-cycle payroll entry.
            RETRO: Retroactive adjustment entry.
            BONUS: Bonus payroll entry.
        element_processing_type_code: { type: string }
        processed_flag: { type: string, enum: [Y, N] }
        retroactive_flag: { type: string, enum: [Y, N] }
        automatic_entry_flag: { type: string, enum: [Y, N] }
        created_by: { type: string }
        creation_date: { type: string, format: date-time }
        last_updated_by: { type: string }
        last_update_date: { type: string, format: date-time }
    ElementEntryListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ElementEntryListItem'
        pagination:
          type: object
          properties:
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 20 }
            total: { type: integer, example: 0 }
            total_pages: { type: integer, example: 0 }
            has_next: { type: boolean, example: false }
            has_previous: { type: boolean, example: false }
    ElementEntryDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/ElementEntryListItem'
