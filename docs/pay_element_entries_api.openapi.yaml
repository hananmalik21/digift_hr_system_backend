openapi: 3.0.3
info:
  title: Digify ERP — Payroll Element Entries API
  version: 2.0.0
  description: |
    Create, update, and delete payroll element entries via `PAY.PAY_ELEMENT_ENTRIES_PKG`.
    List and read use `PAY.V_PAY_ELEMENT_ENTRIES`.

    Update and delete use `element_entry_guid` only (never `element_entry_id`).

    Entry values: numeric `pay_value` and `amount` (NUMBER(18,3)), plus `currency_code`.
    Costing: `cost_allocation_keyflex_id` is VARCHAR2(100).

    Removed/unsupported: `INPUT_VALUE_ID`, `TEXT_VALUE`, `DATE_VALUE`, `ASSIGNMENT_ID`.

    **Auth:** JWT required. Audit columns from `req.user.username`.

    **HTTP status:** Package business errors return HTTP 200 with `success: false`.
servers:
  - url: /
tags:
  - name: Payroll Element Entries
    description: Element entry lifecycle via PAY.PAY_ELEMENT_ENTRIES_PKG
paths:
  /api/pay/element-entries:
    get:
      tags: [Payroll Element Entries]
      summary: List element entries
      operationId: listPayElementEntries
      description: |
        Reads from `PAY.V_PAY_ELEMENT_ENTRIES` for the Manage Element Entries list screen.
        `enterprise_id` is required. `effective_date` matches rows where the date falls between
        `EFFECTIVE_START_DATE` and `EFFECTIVE_END_DATE` (open-ended when `EFFECTIVE_END_DATE` is null).
      parameters:
        - name: enterprise_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: employee_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: effective_date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
        - name: component_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: classification
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Searches ELEMENT_NAME, EMP_NUMBER, CLASSIFICATION, and STATUS
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated element entry list (empty array when no rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryListResponse'
        '400':
          description: Validation error
        '500':
          description: Unexpected system error
    post:
      tags: [Payroll Element Entries]
      summary: Create element entry
      operationId: createPayElementEntry
      description: Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.CREATE_ELEMENT_ENTRY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementEntryCreateRequest'
            examples:
              monthlySalary:
                summary: Full create payload
                value:
                  enterprise_id: 1
                  employee_id: 1001
                  payroll_id: 4
                  component_id: 10
                  element_classification_code: STANDARD_EARNING
                  effective_as_of_date: '2026-06-21'
                  effective_start_date: '2026-06-01'
                  effective_end_date: null
                  entry_type_code: ELEMENT_ENTRY
                  source_code: MANUAL_ENTRY
                  element_processing_type_code: RECURRING
                  subpriority: 1
                  creator_type_code: USER
                  processed_flag: N
                  retroactive_flag: N
                  automatic_entry_flag: N
                  sequence_number: 1
                  reason_text: Monthly salary
                  pay_value: 500
                  amount: 500
                  currency_code: KWD
                  cost_allocation_keyflex_id: CC-HR-KWT
                  costing_type_code: COSTED
                  account_code: 5000-100-100
                  cost_center_code: HR
                  context_segment_code: BUSINESS_UNIT
                  context_value: KUWAIT
                  approval_status_code: DRAFT
                  comments: Created manually
                  source_reference: null
                  batch_id: null
      responses:
        '200':
          description: Create succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryCreateResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Request validation or reference validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '500':
          description: Unexpected system error
  /api/pay/element-entries/{guid}:
    parameters:
      - $ref: '#/components/parameters/ElementEntryGuidPath'
    get:
      tags: [Payroll Element Entries]
      summary: Get element entry by GUID
      operationId: getPayElementEntryByGuid
      description: Returns one row from `PAY.V_PAY_ELEMENT_ENTRIES` by `element_entry_guid`.
      responses:
        '200':
          description: Element entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementEntryDetailResponse'
        '400':
          description: Invalid GUID
        '404':
          description: Element entry not found
        '500':
          description: Unexpected system error
    put:
      tags: [Payroll Element Entries]
      summary: Update element entry
      operationId: updatePayElementEntry
      description: Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.UPDATE_ELEMENT_ENTRY` by `element_entry_guid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementEntryUpdateRequest'
            examples:
              partialUpdate:
                value:
                  pay_value: 600
                  amount: 600
                  currency_code: KWD
                  cost_allocation_keyflex_id: CC-HR-KWT
                  comments: Updated amount
                  effective_end_date: '2026-12-31'
      responses:
        '200':
          description: Update succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryMutationResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Request validation error
        '500':
          description: Unexpected system error
    delete:
      tags: [Payroll Element Entries]
      summary: Delete element entry
      operationId: deletePayElementEntry
      description: Calls `PAY.PAY_ELEMENT_ENTRIES_PKG.DELETE_ELEMENT_ENTRY` by `element_entry_guid`.
      responses:
        '200':
          description: Delete succeeded or package business validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElementEntryMutationResponse'
                  - $ref: '#/components/schemas/ElementEntryBusinessErrorResponse'
        '400':
          description: Invalid GUID
        '500':
          description: Unexpected system error
components:
  parameters:
    ElementEntryGuidPath:
      name: guid
      in: path
      required: true
      description: 32-character hexadecimal element_entry_guid
      schema:
        type: string
        example: a1b2c3d4e5f6789012345678abcdef01
  schemas:
    ElementEntryCreateRequest:
      type: object
      required:
        - enterprise_id
        - employee_id
        - component_id
        - effective_as_of_date
        - effective_start_date
        - pay_value
        - amount
      additionalProperties: true
      properties:
        enterprise_id: { type: integer, minimum: 1 }
        employee_id: { type: integer, minimum: 1 }
        payroll_id: { type: integer, minimum: 1 }
        component_id: { type: integer, minimum: 1 }
        element_classification_code: { type: string }
        effective_as_of_date: { type: string, format: date }
        effective_start_date: { type: string, format: date }
        effective_end_date: { type: string, format: date, nullable: true }
        entry_type_code: { type: string }
        source_code: { type: string }
        element_processing_type_code: { type: string }
        subpriority: { type: integer }
        creator_type_code: { type: string }
        processed_flag: { type: string, enum: [Y, N] }
        retroactive_flag: { type: string, enum: [Y, N] }
        automatic_entry_flag: { type: string, enum: [Y, N] }
        sequence_number: { type: integer }
        reason_text: { type: string }
        pay_value: { type: number, description: PAY_VALUE NUMBER(18,3) }
        amount: { type: number, description: AMOUNT NUMBER(18,3) }
        currency_code: { type: string }
        cost_allocation_keyflex_id:
          type: string
          maxLength: 100
          description: VARCHAR2(100) cost allocation key flexfield id
        costing_type_code: { type: string }
        account_code: { type: string }
        cost_center_code: { type: string }
        context_segment_code: { type: string }
        context_value: { type: string }
        approval_status_code: { type: string }
        comments: { type: string }
        source_reference: { type: string, nullable: true }
        batch_id: { type: string, nullable: true }
    ElementEntryUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      properties:
        enterprise_id: { type: integer }
        employee_id: { type: integer }
        payroll_id: { type: integer }
        component_id: { type: integer }
        pay_value: { type: number }
        amount: { type: number }
        currency_code: { type: string }
        cost_allocation_keyflex_id: { type: string, maxLength: 100 }
        comments: { type: string }
        effective_end_date: { type: string, format: date }
        batch_id: { type: string, nullable: true }
    ElementEntryCreateResponse:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            element_entry_id: { type: integer }
            element_entry_guid: { type: string }
    ElementEntryMutationResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    ElementEntryBusinessErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    ElementEntryListItem:
      type: object
      properties:
        element_entry_id: { type: integer }
        element_entry_guid: { type: string }
        enterprise_id: { type: integer }
        employee_id: { type: integer }
        payroll_id: { type: integer }
        component_id: { type: integer }
        element_name: { type: string }
        primary_entry_value: { type: number }
        amount: { type: number }
        currency_code: { type: string }
        value_name: { type: string }
        source: { type: string }
        employment_level: { type: string }
        seq: { type: integer }
        reason: { type: string }
        classification: { type: string }
        ldg: { type: string }
        emp_number: { type: string }
        status: { type: string }
        effective_as_of_date: { type: string, format: date }
        effective_start_date: { type: string, format: date }
        effective_end_date: { type: string, format: date, nullable: true }
        entry_type_code: { type: string }
        element_processing_type_code: { type: string }
        processed_flag: { type: string, enum: [Y, N] }
        retroactive_flag: { type: string, enum: [Y, N] }
        automatic_entry_flag: { type: string, enum: [Y, N] }
        created_by: { type: string }
        creation_date: { type: string, format: date-time }
        last_updated_by: { type: string }
        last_update_date: { type: string, format: date-time }
    ElementEntryListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ElementEntryListItem'
        pagination:
          type: object
          properties:
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 20 }
            total: { type: integer, example: 0 }
            total_pages: { type: integer, example: 0 }
            has_next: { type: boolean, example: false }
            has_previous: { type: boolean, example: false }
    ElementEntryDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/ElementEntryListItem'
