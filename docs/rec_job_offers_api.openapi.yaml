openapi: 3.0.3
info:
  title: Digify ERP — Recruitment Job Offers API
  version: 2.0.0
  description: |
    Job offers via `REC.REC_JOB_OFFER_PKG` (mutations only).

    **Lifecycle:** CREATE_OFFER → `SENT` → `ACCEPTED` | `DECLINED` | `WITHDRAWN` | `EXPIRED` (scheduler).

    **Statuses:** `SENT`, `ACCEPTED`, `DECLINED`, `WITHDRAWN`, `EXPIRED` (no draft status).

    Package validation messages are returned directly (e.g. "Only sent offers can be updated.").

    **Auth:** `POST /api/rec/job-offers` requires JWT. Accept, decline, and withdraw are public career-portal endpoints (no token).

    **Route:** `/api/rec/job-offers`
servers:
  - url: /
tags:
  - name: Recruitment Job Offers
    description: REC.REC_JOB_OFFER_PKG job offer management
paths:
  /api/rec/job-offers:
    post:
      tags: [Recruitment Job Offers]
      summary: Create and send job offer
      operationId: createRecJobOffer
      description: |
        Calls `REC.REC_JOB_OFFER_PKG.CREATE_OFFER`.
        On success the offer is created with `STATUS_CODE = SENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferCreateRequest'
      responses:
        '200':
          description: Offer created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/rec/job-offers/{offerGuid}/accept:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Accept offer
      operationId: acceptRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.ACCEPT_OFFER`. Only `SENT` offers can be updated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
  /api/rec/job-offers/{offerGuid}/decline:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Decline offer
      operationId: declineRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.DECLINE_OFFER`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
  /api/rec/job-offers/{offerGuid}/withdraw:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Withdraw offer
      operationId: withdrawRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.WITHDRAW_OFFER`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
components:
  parameters:
    OfferGuidPath:
      name: offerGuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{32}$'
  responses:
    ValidationOrPackageError:
      description: Validation or package business error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        status: { type: string, example: ERROR }
        message: { type: string }
    JobOfferComponent:
      type: object
      properties:
        plan_id: { type: integer }
        component_id: { type: integer }
        amount: { type: number }
        currency_code: { type: string }
        frequency_code: { type: string }
    JobOfferCreateRequest:
      type: object
      required:
        - enterprise_id
        - application_guid
        - candidate_guid
        - posting_id
        - job_title
        - start_date
        - created_by
      properties:
        enterprise_id: { type: integer }
        application_guid: { type: string }
        candidate_guid: { type: string }
        posting_id: { type: integer }
        job_title: { type: string }
        position_id: { type: string, nullable: true }
        department_id: { type: string, nullable: true }
        location_id: { type: string, nullable: true }
        work_mode_code: { type: string }
        employment_type_code: { type: string }
        grade_id: { type: integer, nullable: true }
        reporting_manager_id: { type: integer, nullable: true }
        start_date: { type: string, format: date }
        comments: { type: string }
        components:
          type: array
          items:
            $ref: '#/components/schemas/JobOfferComponent'
        benefits:
          type: object
          additionalProperties: true
        terms:
          type: object
          additionalProperties: true
        created_by: { type: string }
    JobOfferCreateResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string, example: SUCCESS }
        message: { type: string, example: Offer created and sent successfully. }
        data:
          type: object
          properties:
            offer_id: { type: integer }
            offer_guid: { type: string }
            status_code: { type: string, example: SENT }
    JobOfferActionRequest:
      type: object
      required: [updated_by]
      properties:
        updated_by: { type: string }
    JobOfferActionResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string }
