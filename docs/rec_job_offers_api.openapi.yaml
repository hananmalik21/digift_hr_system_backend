openapi: 3.0.3
info:
  title: Digify ERP — Recruitment Job Offers API
  version: 3.0.0
  description: |
    Job offers via `REC.REC_JOB_OFFER_PKG` and `REC.V_JOB_OFFERS`.

    **Lifecycle:** Draft Offer (`DRAFT`) → Offer Approval (`APPROVED` / `REJECTED`) → Extend to Candidate (`EXTENDED`) → Candidate Response (`ACCEPTED` / `DECLINED` / `EXPIRED`) or Company Action (`WITHDRAWN`).

    **Auth:** Create, approve, reject, extend, withdraw, and reads require JWT. Accept and decline are public career-portal endpoints.

    Package validation messages are returned directly (e.g. "Only sent offers can be updated.").
servers:
  - url: /
tags:
  - name: Recruitment Job Offers
paths:
  /api/rec/job-offers:
    get:
      tags: [Recruitment Job Offers]
      summary: List job offers
      operationId: listRecJobOffers
      parameters:
        - $ref: '#/components/parameters/EnterpriseIdQuery'
        - name: status_code
          in: query
          schema:
            type: string
            enum: [DRAFT, APPROVED, REJECTED, EXTENDED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        - name: candidate_guid
          in: query
          schema: { type: string }
        - name: application_guid
          in: query
          schema: { type: string }
        - name: posting_id
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferListResponse'
    post:
      tags: [Recruitment Job Offers]
      summary: Create draft job offer
      operationId: createRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.CREATE_OFFER`. Creates offer in `DRAFT` status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferCreateResponse'
  /api/rec/job-offers/{offerGuid}/approve:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Approve offer
      operationId: approveRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.APPROVE_OFFER`. Allowed when status is `DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/reject:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Reject offer
      operationId: rejectRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.REJECT_OFFER`. Allowed when status is `DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/extend:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Extend offer to candidate
      operationId: extendRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.EXTEND_OFFER`. Allowed when status is `APPROVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/accept:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Accept offer
      operationId: acceptRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.ACCEPT_OFFER`. Allowed when status is `EXTENDED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/decline:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Decline offer
      operationId: declineRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.DECLINE_OFFER`. Allowed when status is `EXTENDED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferDeclineRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/withdraw:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Withdraw offer
      operationId: withdrawRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.WITHDRAW_OFFER`. Allowed from `DRAFT`, `APPROVED`, or `EXTENDED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    get:
      tags: [Recruitment Job Offers]
      summary: Get job offer details
      operationId: getRecJobOfferByGuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    EnterpriseIdQuery:
      name: enterprise_id
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    PageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitQuery:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    OfferGuidPath:
      name: offerGuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{32}$'
  responses:
    NotFound:
      description: Offer not found
  schemas:
    OfferStageFields:
      type: object
      properties:
        stage: { type: string, example: Extend to Candidate }
        status_code: { type: string, example: EXTENDED }
        stage_description: { type: string }
        decline_comments: { type: string, nullable: true, example: I accepted another offer. }
    JobOfferCreateRequest:
      type: object
      required: [enterprise_id, application_guid, candidate_guid, posting_id, job_title, start_date, created_by]
      properties:
        enterprise_id: { type: integer }
        application_guid: { type: string }
        candidate_guid: { type: string }
        posting_id: { type: integer }
        job_title: { type: string }
        position_id: { type: string, nullable: true }
        department_id: { type: string, nullable: true }
        location_id: { type: string, nullable: true }
        work_mode_code: { type: string }
        employment_type_code: { type: string }
        grade_id: { type: integer, nullable: true }
        reporting_manager_id: { type: integer, nullable: true }
        start_date: { type: string, format: date }
        comments: { type: string }
        components: { type: array, items: { type: object } }
        benefits: { type: object }
        terms: { type: object }
        created_by: { type: string }
    JobOfferCreateResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string, example: Offer created successfully. }
        data:
          allOf:
            - type: object
              properties:
                offer_id: { type: integer }
                offer_guid: { type: string }
            - $ref: '#/components/schemas/OfferStageFields'
    JobOfferActionRequest:
      type: object
      required: [updated_by]
      properties:
        updated_by: { type: string }
    JobOfferDeclineRequest:
      type: object
      required: [decline_comments, updated_by]
      properties:
        decline_comments:
          type: string
          maxLength: 4000
          example: I accepted another offer.
        updated_by: { type: string, example: CANDIDATE }
    JobOfferActionResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string }
    JobOfferListItem:
      allOf:
        - type: object
          properties:
            offer_guid: { type: string }
            offer_number: { type: string }
        - $ref: '#/components/schemas/OfferStageFields'
        - type: object
          properties:
            application_guid: { type: string }
            application_number: { type: string }
            candidate_guid: { type: string }
            candidate_name: { type: string }
            posting_id: { type: integer }
            job_title: { type: string }
            position_name: { type: string }
            department_name: { type: string }
            start_date: { type: string, format: date }
            offer_date: { type: string, format: date }
            expiry_date: { type: string, format: date }
    JobOfferListResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        meta: { type: object }
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobOfferListItem'
    JobOfferDetailResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            offer:
              allOf:
                - type: object
                - $ref: '#/components/schemas/OfferStageFields'
            components: { type: array, items: { type: object } }
            benefits: { type: object }
            terms: { type: object }
