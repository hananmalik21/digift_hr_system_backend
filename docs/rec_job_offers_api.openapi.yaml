openapi: 3.0.3
info:
  title: Digify ERP — Recruitment Job Offers API
  version: 3.0.0
  description: |
    Job offers via `REC.REC_JOB_OFFER_PKG` and `REC.V_JOB_OFFER_MANAGEMENT`.

    **Lifecycle:** Draft Offer (`DRAFT`) → Offer Approval (`APPROVED` / `REJECTED`) → Extend to Candidate (`EXTENDED`) → Candidate Response (`ACCEPTED` / `DECLINED` / `EXPIRED`) or Company Action (`WITHDRAWN`).

    **Auth:** Create, approve, reject, extend, withdraw, and ERP reads require JWT. Career portal (no JWT): `GET /api/candidate/offers`, `GET /api/candidate/offers/{offerGuid}`, accept, and decline.

    Package validation messages are returned directly (e.g. "Only sent offers can be updated.").
servers:
  - url: /
tags:
  - name: Recruitment Job Offers
paths:
  /api/rec/job-offers:
    get:
      tags: [Recruitment Job Offers]
      summary: List job offers (offer management)
      operationId: listRecJobOffers
      description: Reads from `REC.V_JOB_OFFER_MANAGEMENT` only.
      parameters:
        - $ref: '#/components/parameters/EnterpriseIdQuery'
        - name: status
          in: query
          description: Matches `display_status` or `status_code`.
          schema:
            type: string
            example: ACCEPTED
        - name: search
          in: query
          description: Searches offer number, job title, posting title, candidate name, and location.
          schema: { type: string }
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferListResponse'
    post:
      tags: [Recruitment Job Offers]
      summary: Create draft job offer
      operationId: createRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.CREATE_OFFER`. Creates offer in `DRAFT` status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferCreateResponse'
  /api/rec/job-offers/{offerGuid}/approve:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Approve offer
      operationId: approveRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.APPROVE_OFFER`. Allowed when status is `DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/reject:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Reject offer
      operationId: rejectRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.REJECT_OFFER`. Allowed when status is `DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/extend:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Extend offer to candidate
      operationId: extendRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.EXTEND_OFFER`. Allowed when status is `APPROVED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/accept:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Accept offer
      operationId: acceptRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.ACCEPT_OFFER`. Allowed when status is `EXTENDED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/decline:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Decline offer
      operationId: declineRecJobOffer
      description: |
        Career portal — no JWT required.
        Calls `REC.REC_JOB_OFFER_PKG.DECLINE_OFFER`. Allowed when status is `EXTENDED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferDeclineRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}/withdraw:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    post:
      tags: [Recruitment Job Offers]
      summary: Withdraw offer
      operationId: withdrawRecJobOffer
      description: Calls `REC.REC_JOB_OFFER_PKG.WITHDRAW_OFFER`. Allowed from `DRAFT`, `APPROVED`, or `EXTENDED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferActionResponse'
  /api/rec/job-offers/{offerGuid}:
    parameters:
      - $ref: '#/components/parameters/OfferGuidPath'
    get:
      tags: [Recruitment Job Offers]
      summary: Get job offer details
      operationId: getRecJobOfferByGuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    EnterpriseIdQuery:
      name: enterprise_id
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    PageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitQuery:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    OfferGuidPath:
      name: offerGuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{32}$'
  responses:
    NotFound:
      description: Offer not found
  schemas:
    OfferStageFields:
      type: object
      properties:
        stage: { type: string, example: Extend to Candidate }
        status_code: { type: string, example: EXTENDED }
        stage_description: { type: string }
        decline_comments: { type: string, nullable: true, example: Accepted another opportunity. }

    JobOfferCreateRequest:
      type: object
      required: [enterprise_id, application_guid, candidate_guid, posting_id, job_title, start_date, created_by]
      properties:
        enterprise_id: { type: integer }
        application_guid: { type: string }
        candidate_guid: { type: string }
        posting_id: { type: integer }
        job_title: { type: string }
        position_id: { type: string, nullable: true }
        department_id: { type: string, nullable: true }
        location:
          type: string
          nullable: true
          maxLength: 500
          example: Kuwait City, Kuwait
        work_mode_code: { type: string }
        employment_type_code: { type: string }
        grade_id: { type: integer, nullable: true }
        reporting_manager_id: { type: integer, nullable: true }
        start_date: { type: string, format: date }
        comments: { type: string }
        components: { type: array, items: { type: object } }
        benefits: { type: object }
        terms: { type: object }
        created_by: { type: string }
    JobOfferCreateResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string, example: Offer created successfully. }
        data:
          allOf:
            - type: object
              properties:
                offer_id: { type: integer }
                offer_guid: { type: string }
            - $ref: '#/components/schemas/OfferStageFields'
    JobOfferActionRequest:
      type: object
      required: [updated_by]
      properties:
        updated_by: { type: string }
    JobOfferDeclineRequest:
      type: object
      required: [decline_comments, updated_by]
      properties:
        decline_comments:
          type: string
          maxLength: 4000
          example: Accepted another opportunity.

        updated_by: { type: string, example: CANDIDATE }
    JobOfferActionResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string }
    JobOfferListItem:
      type: object
      properties:
        offer_id: { type: integer }
        offer_guid: { type: string }
        enterprise_id: { type: integer }
        application_id: { type: integer }
        candidate_guid: { type: string }
        posting_id: { type: integer }
        offer_number: { type: string }
        posting_guid: { type: string }
        posting_title: { type: string }
        job_title: { type: string }
        location: { type: string }
        work_mode_code: { type: string }
        employment_type_code: { type: string }
        start_date: { type: string, format: date }
        offer_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        status_code: { type: string }
        approval_status: { type: string }
        display_status: { type: string }
        stage: { type: string }
        stage_description: { type: string }
        annual_salary: { type: number }
        candidate_obj: { type: object }
        posting_obj: { type: object }
        position_obj: { type: object }
        department_obj: { type: object }
        grade_obj: { type: object }
        components_json: { type: array, items: { type: object } }
        benefits_json: { type: object }
        terms_json: { type: object }
        comments: { type: string, nullable: true }
        decline_comments: { type: string, nullable: true }
        created_by: { type: string }
        creation_date: { type: string }
        last_updated_by: { type: string }
        last_update_date: { type: string }
    JobOfferListResponse:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobOfferListItem'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
    JobOfferDetailResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            offer:
              allOf:
                - type: object
                - $ref: '#/components/schemas/OfferStageFields'
            components: { type: array, items: { type: object } }
            benefits: { type: object }
            terms: { type: object }
