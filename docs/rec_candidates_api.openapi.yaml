openapi: 3.0.3
info:
  title: Digify ERP — Recruitment Candidates API
  version: 1.2.0
  description: |
    Candidate create/update via `REC.CANDIDATE_PKG` (`CREATE_CANDIDATE`, `UPDATE_CANDIDATE`).
    List/detail read from `REC.CANDIDATES_FULL_V`.

    **Routes:** `/api/rec/candidates` and `/api/recruitment/candidates` (same handlers).

    **Profile & compensation fields:** `current_salary` (>= 0), `portfolio_link`, `github_link`
    (http/https URLs), `willing_to_relocate` (Y or N; defaults to N on create when omitted).

    **Demographic fields (optional):** `dob` (YYYY-MM-DD, not future), `gender`, `nationality`,
    `visa_status`, `alternate_phone`, `alternate_email` (lowercased), `preferred_location`,
    `source_from` (separate from `source`).

    **Search:** `search` matches name, email, title, education/experience JSON, `portfolio_link`, `github_link`.

    Supports `application/json` or `multipart/form-data` (resume upload).
servers:
  - url: /
    description: Application base URL (configure `{{baseUrl}}` in clients)
tags:
  - name: Recruitment Candidates
    description: REC.CANDIDATE_PKG candidate management
paths:
  /api/rec/candidates:
    get:
      tags: [Recruitment Candidates]
      summary: List candidates
      operationId: listRecCandidates
      description: Reads from `REC.CANDIDATES_FULL_V`. Includes profile & compensation fields per row.
      parameters:
        - name: enterprise_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Matches name, email, title, education/experience JSON, portfolio_link, github_link.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Paginated candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Recruitment Candidates]
      summary: Create candidate
      operationId: createRecCandidate
      description: |
        Calls `REC.CANDIDATE_PKG.CREATE_CANDIDATE`. URL fields are trimmed before save.
        `willing_to_relocate` must be Y or N when sent; omitted values default to N in the database package.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreateRequest'
            example:
              enterprise_id: 1
              first_name: John
              last_name: Doe
              email: john.doe@example.com
              expected_salary: 2500
              current_salary: 2000
              salary_currency: KWD
              linkedin_profile: https://linkedin.com/in/johndoe
              portfolio_link: https://portfolio.example.com/john
              github_link: https://github.com/johndoe
              willing_to_relocate: Y
              dob: '1990-05-15'
              gender: MALE
              nationality: Pakistani
              visa_status: TRANSFERABLE
              alternate_phone: '+96551111111'
              alternate_email: Candidate.Alt@Example.com
              preferred_location: Kuwait City
              source: CAREER_PORTAL
              source_from: LinkedIn Campaign
              created_by: ADMIN
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateCreateMultipart'
      responses:
        '200':
          description: Candidate created (package status SUCCESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/rec/candidates/{candidateGuid}:
    parameters:
      - $ref: '#/components/parameters/CandidateGuidPath'
    get:
      tags: [Recruitment Candidates]
      summary: Get candidate detail
      operationId: getRecCandidateByGuid
      parameters:
        - name: enterprise_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Candidate detail from `REC.CANDIDATES_FULL_V`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetailResponse'
        '404':
          description: Candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Recruitment Candidates]
      summary: Update candidate
      operationId: updateRecCandidate
      description: |
        Calls `REC.CANDIDATE_PKG.UPDATE_CANDIDATE`. URL fields are trimmed before save.
        Invalid `willing_to_relocate` returns validation error (Y or N only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateRequest'
            example:
              enterprise_id: 1
              current_salary: 2200
              portfolio_link: https://portfolio.example.com/john
              github_link: https://github.com/johndoe
              willing_to_relocate: N
              status_code: ACTIVE
              updated_by: ADMIN
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateUpdateMultipart'
      responses:
        '200':
          description: Candidate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateActionResponse'
        '400':
          $ref: '#/components/responses/ValidationOrPackageError'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    CandidateGuidPath:
      name: candidateGuid
      in: path
      required: true
      description: 32-character hexadecimal candidate GUID (dashes optional)
      schema:
        type: string
        pattern: '^[0-9A-Fa-f-]{32,36}$'
        example: 50FDBB885E1D190DE0633519000A3BAC
  responses:
    ValidationOrPackageError:
      description: Validation failed or package returned ERROR status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    YnFlag:
      type: string
      enum: [Y, N]
      description: Oracle CHAR(1) flag
    CandidateProfileCompensationFields:
      type: object
      properties:
        current_salary:
          type: number
          minimum: 0
          nullable: true
          description: Current compensation amount (must be >= 0 when provided)
        portfolio_link:
          type: string
          format: uri
          maxLength: 1000
          nullable: true
          description: Portfolio URL — http or https (trimmed before save)
        github_link:
          type: string
          format: uri
          maxLength: 1000
          nullable: true
          description: GitHub profile URL — http or https (trimmed before save)
        willing_to_relocate:
          $ref: '#/components/schemas/YnFlag'
          description: Defaults to N on create when omitted
    CandidateDemographicFields:
      type: object
      properties:
        dob:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD). Maps to P_DATE_OF_BIRTH. Must not be a future date.
          example: '1990-05-15'
        gender:
          type: string
          nullable: true
          description: Normalized to uppercase when supplied (e.g. MALE)
          example: MALE
        nationality:
          type: string
          nullable: true
          example: Pakistani
        visa_status:
          type: string
          nullable: true
          description: Visa / work authorization status
          example: TRANSFERABLE
        alternate_phone:
          type: string
          nullable: true
          description: Alternate phone as string (preserves + prefix)
          example: '+96551111111'
        alternate_email:
          type: string
          format: email
          nullable: true
          description: Alternate email — trimmed and lowercased before save
          example: candidate.alt@example.com
        preferred_location:
          type: string
          nullable: true
          description: Preferred work location (separate from current_location)
          example: Kuwait City
        source_from:
          type: string
          nullable: true
          description: Source detail / campaign (separate from source)
          example: LinkedIn Campaign
    CandidateSkillItem:
      type: object
      required: [skill_name]
      properties:
        candidate_skill_guid:
          type: string
          nullable: true
          description: Present on GET responses after persist
        skill_name:
          type: string
          example: Oracle PL/SQL
    CandidateEducationItem:
      type: object
      properties:
        degree_name: { type: string }
        institution_name: { type: string }
        field_of_study: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        grade: { type: string, nullable: true }
        description: { type: string, nullable: true }
    CandidateExperienceItem:
      type: object
      properties:
        company_name: { type: string }
        job_title: { type: string }
        location: { type: string, nullable: true }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        current_job_flag: { $ref: '#/components/schemas/YnFlag' }
        description: { type: string, nullable: true }
    CandidateCoreFields:
      type: object
      required: [enterprise_id]
      properties:
        enterprise_id:
          type: integer
          minimum: 1
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        current_title: { type: string }
        current_employer: { type: string }
        years_experience: { type: number }
        current_location: { type: string }
        source: { type: string }
        expected_salary: { type: number }
        salary_currency: { type: string }
        notice_period: { type: integer }
        linkedin_profile:
          type: string
          maxLength: 1000
          description: LinkedIn URL (trimmed before save)
        education:
          type: array
          description: |
            Education history (maps to P_EDUCATION_JSON). On update: omit to keep existing;
            send [] to delete all; send items to replace.
          items:
            $ref: '#/components/schemas/CandidateEducationItem'
        experience:
          type: array
          description: |
            Work experience (maps to P_EXPERIENCE_JSON). On update: omit to keep existing;
            send [] to delete all; send items to replace.
          items:
            $ref: '#/components/schemas/CandidateExperienceItem'
        education_json:
          type: array
          deprecated: true
          description: Legacy alias for `education`
          items:
            $ref: '#/components/schemas/CandidateEducationItem'
        experience_json:
          type: array
          deprecated: true
          description: Legacy alias for `experience`
          items:
            $ref: '#/components/schemas/CandidateExperienceItem'
        skills:
          type: array
          description: |
            Candidate skills (maps to P_SKILLS_JSON). On update: omit to keep existing;
            send [] to delete all; send items to replace.
          items:
            $ref: '#/components/schemas/CandidateSkillItem'
        file_name: { type: string }
        file_type: { type: string }
        file_size: { type: integer }
        file_content:
          type: string
          description: Base64-encoded resume (JSON body only)
    CandidateCreateRequest:
      allOf:
        - $ref: '#/components/schemas/CandidateCoreFields'
        - $ref: '#/components/schemas/CandidateProfileCompensationFields'
        - $ref: '#/components/schemas/CandidateDemographicFields'
        - type: object
          properties:
            created_by: { type: string }
    CandidateUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CandidateCoreFields'
        - $ref: '#/components/schemas/CandidateProfileCompensationFields'
        - $ref: '#/components/schemas/CandidateDemographicFields'
        - type: object
          properties:
            candidate_guid:
              type: string
              description: Optional when GUID is in the URL path
            status_code: { type: string }
            updated_by: { type: string }
    CandidateCreateMultipart:
      allOf:
        - $ref: '#/components/schemas/CandidateCreateRequest'
        - type: object
          properties:
            resume:
              type: string
              format: binary
            file:
              type: string
              format: binary
            attachment:
              type: string
              format: binary
            document:
              type: string
              format: binary
    CandidateUpdateMultipart:
      allOf:
        - $ref: '#/components/schemas/CandidateUpdateRequest'
        - type: object
          properties:
            resume:
              type: string
              format: binary
    CandidateCreateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        candidate_id: { type: integer, example: 101 }
        candidate_guid:
          type: string
          example: 50FDBB885E1D190DE0633519000A3BAC
        status: { type: string, example: SUCCESS }
        message: { type: string, example: Candidate created successfully. }
    CandidateActionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: string, example: SUCCESS }
        message: { type: string, example: Candidate updated successfully. }
    CandidateListItem:
      allOf:
        - $ref: '#/components/schemas/CandidateProfileCompensationFields'
        - $ref: '#/components/schemas/CandidateDemographicFields'
        - type: object
          properties:
            candidate_guid: { type: string }
            full_name: { type: string }
            email: { type: string, format: email }
            current_title: { type: string }
            current_employer: { type: string }
            years_experience: { type: number }
            expected_salary: { type: number }
            salary_currency: { type: string }
            source: { type: string }
            current_location: { type: string }
    CandidateListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CandidateListItem'
          example:
            - candidate_guid: 50FDBB885E1D190DE0633519000A3BAC
              full_name: John Doe
              email: john@example.com
              current_title: Senior Software Engineer
              current_employer: ABC Company
              years_experience: 5
              current_salary: 1200
              expected_salary: 1500
              salary_currency: KWD
              portfolio_link: https://portfolio.example.com
              github_link: https://github.com/johndoe
              willing_to_relocate: Y
              dob: '1990-05-15'
              gender: MALE
              nationality: Pakistani
              visa_status: TRANSFERABLE
              preferred_location: Kuwait City
              source_from: LinkedIn Campaign
    CandidateDetailResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          allOf:
            - $ref: '#/components/schemas/CandidateProfileCompensationFields'
            - $ref: '#/components/schemas/CandidateDemographicFields'
            - type: object
              additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        status: { type: string, example: ERROR }
        message: { type: string, example: willing_to_relocate must be Y or N }
