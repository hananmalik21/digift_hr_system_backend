openapi: 3.0.3
info:
  title: Digify ERP — Bulk Compensation Adjustments API
  version: 1.0.0
  description: |
  The request `employees` array is serialized to Oracle `p_components_json` as `{ "employees": [...] }`.
  Each component receives `effective_start_date` from header `effective_date`.
servers:
  - url: /
    description: Application base URL (configure `{{baseUrl}}` in clients)
tags:
  - name: Compensation
    description: Compensation processing and adjustments
paths:
  /api/compensation/bulk-adjustments:
    post:
      tags:
        - Compensation
      summary: Bulk adjust employee compensation components
      operationId: postBulkCompensationAdjustments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCompensationAdjustmentRequest'
            examples:
              singleEmployee:
                summary: Single employee, one component
                value:
                  enterprise_id: 1
                  adjustment_type: BULK_ADJUSTMENT
                  effective_date: '2026-05-01'
                  reason_code: BULK_UPDATE
                  budget_code: DEFAULT
                  justification_text: Bulk compensation adjustment
                  updated_by: ADMIN
                  employees:
                    - employee_id: 101
                      plan_id: 111
                      components:
                        - component_id: 97
                          amount: 1200
                          currency_code: KWD
                          adjustment_method: BULK_ADJUSTMENT
                          replace_flag: 'Y'
                          delete_flag: 'N'
                          active_flag: 'Y'
                          effective_end_date: null
              multipleEmployees:
                summary: Multiple employees with multiple components
                value:
                  enterprise_id: 1
                  adjustment_type: BULK_ADJUSTMENT
                  effective_date: '2026-05-01'
                  reason_code: BULK_UPDATE
                  budget_code: DEFAULT
                  justification_text: Annual bulk update
                  updated_by: ADMIN
                  employees:
                    - employee_id: 101
                      plan_id: 111
                      components:
                        - component_id: 97
                          amount: 1200
                          currency_code: KWD
                          adjustment_method: BULK_ADJUSTMENT
                          replace_flag: 'Y'
                          delete_flag: 'N'
                          active_flag: 'Y'
                          effective_end_date: null
                        - component_id: 98
                          amount: 300
                          currency_code: KWD
                          adjustment_method: BULK_ADJUSTMENT
                          replace_flag: 'Y'
                          delete_flag: 'N'
                          active_flag: 'Y'
                          effective_end_date: '2026-12-31'
                    - employee_id: 102
                      plan_id: 112
                      components:
                        - component_id: 97
                          amount: 1500
                          currency_code: KWD
                          adjustment_method: BULK_ADJUSTMENT
                          replace_flag: 'Y'
                          delete_flag: 'N'
                          active_flag: 'Y'
                          effective_end_date: null
      responses:
        '200':
          description: Bulk adjustment completed (per-employee failures may appear in counts and message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCompensationAdjustmentResponse'
              examples:
                partialSuccess:
                  summary: Mixed success and failure
                  value:
                    success: true
                    success_count: 2
                    error_count: 1
                    message: >-
                      Adjustment completed successfully for employees: EMP-101, EMP-102.
                      Failed for employees: EMP-111 - Amount is required.
                    results:
                      employees:
                        - employee_id: 101
                          status: SUCCESS
                        - employee_id: 102
                          status: SUCCESS
                        - employee_id: 111
                          status: ERROR
                          error: Amount is required.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCompensationAdjustmentErrorResponse'
              example:
                success: false
                message: employees must be a non-empty array
        '500':
          description: Server or database error (Oracle codes are not exposed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCompensationAdjustmentErrorResponse'
              example:
                success: false
                message: Unable to complete bulk compensation adjustment. Please try again later.
components:
  schemas:
    BulkCompensationAdjustmentRequest:
      type: object
      required:
        - enterprise_id
        - adjustment_type
        - effective_date
        - reason_code
        - budget_code
        - justification_text
        - updated_by
        - employees
      additionalProperties: false
      properties:
        enterprise_id:
          type: integer
          minimum: 1
          example: 1
        adjustment_type:
          type: string
          example: BULK_ADJUSTMENT
        effective_date:
          type: string
          format: date
          example: '2026-05-01'
        reason_code:
          type: string
          example: BULK_UPDATE
        budget_code:
          type: string
          example: DEFAULT
        justification_text:
          type: string
          example: Bulk compensation adjustment
        updated_by:
          type: string
          example: ADMIN
        employees:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BulkCompensationEmployee'
    BulkCompensationEmployee:
      type: object
      required:
        - employee_id
        - plan_id
        - components
      additionalProperties: false
      properties:
        employee_id:
          type: integer
          minimum: 1
          example: 101
        plan_id:
          type: integer
          minimum: 1
          example: 111
        components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BulkCompensationComponent'
    BulkCompensationComponent:
      type: object
      required:
        - component_id
        - amount
        - currency_code
        - adjustment_method
        - replace_flag
        - delete_flag
        - active_flag
      additionalProperties: false
      properties:
        component_id:
          type: integer
          minimum: 1
          example: 97
        amount:
          type: number
          example: 1200
        currency_code:
          type: string
          maxLength: 15
          example: KWD
        adjustment_method:
          type: string
          example: BULK_ADJUSTMENT
        replace_flag:
          type: string
          enum: ['Y', 'N']
          example: 'Y'
        delete_flag:
          type: string
          enum: ['Y', 'N']
          example: 'N'
        active_flag:
          type: string
          enum: ['Y', 'N']
          example: 'Y'
        effective_end_date:
          type: string
          format: date
          nullable: true
          example: null
    BulkCompensationAdjustmentResponse:
      type: object
      required:
        - success
        - success_count
        - error_count
        - message
        - results
      properties:
        success:
          type: boolean
          example: true
        success_count:
          type: integer
          example: 2
        error_count:
          type: integer
          example: 1
        message:
          type: string
          example: >-
            Adjustment completed successfully for employees: EMP-101, EMP-102.
            Failed for employees: EMP-111 - Amount is required.
        results:
          type: object
          description: Parsed JSON from Oracle OUT parameter x_result_json
          additionalProperties: true
    BulkCompensationAdjustmentErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: employees must be a non-empty array
