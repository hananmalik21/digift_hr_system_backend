openapi: 3.0.3
info:
  title: Digify ERP — Recruitment Job Postings API
  version: 1.2.0
  description: |
    Job posting mutations via `REC.CREATE_JOB_POSTING_PKG`.

    **Content fields:** `about_the_role` (CLOB), `responsibilities` and `qualifications` (JSON array → CLOB).

    **Business rules:**
    - One posting per requisition per enterprise.
    - Expiry is automatic (DB scheduler); no expire API.
    - No list/detail GET endpoints in this API layer.

    **Routes:** `/api/rec/job-postings` and `/api/recruitment/job-postings` (JWT required).
servers:
  - url: /
tags:
  - name: Recruitment Job Postings
paths:
  /api/rec/job-postings:
    post:
      tags: [Recruitment Job Postings]
      summary: Create job posting
      operationId: createRecJobPosting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPostingCreateResponse'
        '400':
          $ref: '#/components/responses/PackageError'
  /api/rec/job-postings/{postingGuid}:
    parameters:
      - $ref: '#/components/parameters/PostingGuidPath'
    put:
      tags: [Recruitment Job Postings]
      summary: Update job posting
      operationId: updateRecJobPosting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionSuccess'
        '400':
          $ref: '#/components/responses/PackageError'
    delete:
      tags: [Recruitment Job Postings]
      summary: Delete job posting
      operationId: deleteRecJobPosting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enterprise_id]
              properties:
                enterprise_id: { type: integer, minimum: 1 }
      responses:
        '200':
          $ref: '#/components/responses/ActionSuccess'
  /api/rec/job-postings/{postingGuid}/pause:
    parameters:
      - $ref: '#/components/parameters/PostingGuidPath'
    post:
      tags: [Recruitment Job Postings]
      summary: Pause job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleActorRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionSuccess'
  /api/rec/job-postings/{postingGuid}/activate:
    parameters:
      - $ref: '#/components/parameters/PostingGuidPath'
    post:
      tags: [Recruitment Job Postings]
      summary: Activate job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleActorRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionSuccess'
  /api/rec/job-postings/{postingGuid}/close:
    parameters:
      - $ref: '#/components/parameters/PostingGuidPath'
    post:
      tags: [Recruitment Job Postings]
      summary: Close job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleActorRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionSuccess'
components:
  parameters:
    PostingGuidPath:
      name: postingGuid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f-]{32,36}$'
  responses:
    PackageError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Job posting already exists for this requisition.
    ActionSuccess:
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
  schemas:
    YnFlag:
      type: string
      enum: [Y, N]
    BulletStringList:
      type: array
      items: { type: string }
    JobPostingContentFields:
      type: object
      properties:
        about_the_role: { type: string }
        responsibilities:
          $ref: '#/components/schemas/BulletStringList'
        qualifications:
          $ref: '#/components/schemas/BulletStringList'
    JobPostingCreateRequest:
      allOf:
        - $ref: '#/components/schemas/JobPostingContentFields'
        - type: object
          required: [enterprise_id, requisition_guid, posting_title, created_by]
          properties:
            enterprise_id: { type: integer, minimum: 1 }
            requisition_guid: { type: string }
            posting_title: { type: string }
            posting_description: { type: string }
            visibility_code: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            internal_site_flag: { $ref: '#/components/schemas/YnFlag' }
            external_site_flag: { $ref: '#/components/schemas/YnFlag' }
            linkedin_flag: { $ref: '#/components/schemas/YnFlag' }
            created_by: { type: string }
    JobPostingUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/JobPostingContentFields'
        - type: object
          required: [enterprise_id, last_updated_by]
          properties:
            enterprise_id: { type: integer, minimum: 1 }
            posting_title: { type: string }
            posting_description: { type: string }
            visibility_code: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            internal_site_flag: { $ref: '#/components/schemas/YnFlag' }
            external_site_flag: { $ref: '#/components/schemas/YnFlag' }
            linkedin_flag: { $ref: '#/components/schemas/YnFlag' }
            last_updated_by: { type: string }
    LifecycleActorRequest:
      type: object
      required: [enterprise_id]
      properties:
        enterprise_id: { type: integer, minimum: 1 }
        paused_by: { type: string }
        activated_by: { type: string }
        closed_by: { type: string }
    JobPostingCreateResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            posting_id: { type: integer }
            posting_guid: { type: string }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
